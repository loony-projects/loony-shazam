[package]
name = "loony-shazam-backend"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust API + matching engine for the Loony Shazam audio recognition system"

[lib]
name = "loony_shazam_backend"
path = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "macros"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout", "request-id", "util", "fs"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "migrate",
    "chrono",
] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }

thiserror = "2"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

dotenvy = "0.15"
base64 = "0.22"

metrics = "0.24"
metrics-exporter-prometheus = "0.16"

rand = "0.8"

redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
http-body-util = "0.1"
url = "2"

[profile.release]
lto = true
codegen-units = 1
