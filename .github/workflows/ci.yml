name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: loony_shazam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:devpass@localhost:5432/loony_shazam
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: cargo fmt --check
        working-directory: backend
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: backend
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        working-directory: backend
        run: cargo test --all

  python:
    name: Python (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: processor
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        working-directory: processor
        run: ruff check .
      - name: ruff format --check
        working-directory: processor
        run: ruff format --check .
      - name: pytest
        working-directory: processor
        run: pytest -v

  android:
    name: Android (build, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew
      - name: Unit tests
        working-directory: android
        run: ./gradlew test --no-daemon
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t loony-shazam-backend:ci .
      - name: Build processor image
        run: docker build -f processor/Dockerfile -t loony-shazam-processor:ci .
      - name: Validate compose config
        run: |
          cp .env.example .env
          docker compose config >/dev/null
